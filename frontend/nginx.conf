server {
    # 8080, а не 80: мастер-процесс работает не под root и порты ниже 1024
    # занять не может. Наружу это отображает compose
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Потолок тела запроса живёт здесь, а не в приложении: у Spring MVC своего
    # предела на JSON нет (лимиты multipart действуют только на форму с файлом),
    # а собственный фильтр по Content-Length закрывает не всё — запрос
    # с Transfer-Encoding: chunked заголовка длины не несёт вовсе.
    # 16m держит загрузку файла: multipart у приложения ограничен 15 МБ
    client_max_body_size 16m;

    # Имена ассетов хешируются при каждой сборке, поэтому старый файл никогда
    # не подменяется новым содержимым и кэшируется навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html имени не хеширует и обязан перепроверяться: иначе браузер
    # откроет старую сборку со ссылками на ассеты, которых уже нет
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;

        # Перезапись, а не $proxy_add_x_forwarded_for: последний дописывает
        # адрес к тому, что прислал клиент, и клиент, подставив заголовок сам,
        # получал бы новое ведро лимита на каждую попытку входа
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные файлы отдаёт nginx, а не приложение: раздача статики
    # занимала потоки Spring. Том смонтирован только на чтение
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Картинки из public/img имён не хешируют: под тем же адресом может лечь
    # новый файл, поэтому кэш — сутки, а не год, как у ассетов. try_files
    # отдаёт честный 404 на отсутствующую картинку вместо index.html с кодом 200
    location /img/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Неизвестный путь — это маршрут роутера, а не отсутствующий файл.
    # Правило стоит последним: до него отрабатывают ассеты, /api и /media
    location / {
        try_files $uri $uri/ /index.html;
    }
}
