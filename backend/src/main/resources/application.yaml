spring:
  application:
    name: uits-backend

  # Профиль по умолчанию, если явно не задан другой (SPRING_PROFILES_ACTIVE).
  # Локальный запуск получает dev (включает DevDataSeeder), тесты задают
  # профиль test, прод обязан задавать prod — иначе в базу попадут тестовые данные.
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5433}/${POSTGRES_DB:uits_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:900000}
    refresh:
      expiration: ${REFRESH_EXPIRATION:1209600000}
      grace-period: ${REFRESH_GRACE_PERIOD:60000}
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cleanup-cron: ${REFRESH_CLEANUP_CRON:0 15 3 * * *}
    login-rate-limit:
      attempts: ${LOGIN_RATE_LIMIT_ATTEMPTS:5}
      period: ${LOGIN_RATE_LIMIT_PERIOD:60000}
      eviction-cron: ${LOGIN_RATE_LIMIT_EVICTION_CRON:0 */10 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    root: ${STORAGE_ROOT:./media}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/media}
    orphan-cleanup:
      cron: ${ORPHAN_CLEANUP_CRON:0 45 3 * * *}
      min-age: ${ORPHAN_CLEANUP_MIN_AGE:86400000}
      categories: ${ORPHAN_CLEANUP_CATEGORIES:news,avatars,achievements}
