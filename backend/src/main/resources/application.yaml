spring:
  application:
    name: uits-backend

  # Профиль по умолчанию, если явно не задан другой (SPRING_PROFILES_ACTIVE).
  # Локальный запуск получает dev (включает DevDataSeeder), тесты задают
  # профиль test, прод обязан задавать prod — иначе в базу попадут тестовые данные.
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5433}/${POSTGRES_DB:uits_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    root: ${STORAGE_ROOT:./media}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/media}
