databaseChangeLog:
  - changeSet:
      id: 015-create-achievement-table
      author: eeffeecct
      changes:
        - createTable:
            tableName: achievements_achievement
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: preview_image
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: display
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: teacher_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: achievements_achievement
            baseColumnNames: teacher_id
            constraintName: fk_achievement_teacher
            referencedTableName: employee_teacher
            referencedColumnNames: id
            onDelete: SET NULL
