databaseChangeLog:
  - changeSet:
      id: 007-create-editable-page
      author: eeffeecct
      changes:
        - createTable:
            tableName: editable_pages_editablepage
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              # nullable намеренно: в строках, перенесённых со старого портала,
              # заголовок не заполнен, и NOT NULL уронил бы восстановление дампа
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: page
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_editable_page_page
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
