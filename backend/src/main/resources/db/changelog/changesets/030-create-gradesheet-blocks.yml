databaseChangeLog:
  - changeSet:
      id: 030-create-gradesheet-blocks
      author: eeffeecct
      changes:
        - createTable:
            tableName: gradesheet_block
            columns:
              - column:
                  name: gradesheet_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: block_order
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: gradesheet_block
            columnNames: gradesheet_id, block_order
            constraintName: pk_gradesheet_block
        - addForeignKeyConstraint:
            baseTableName: gradesheet_block
            baseColumnNames: gradesheet_id
            constraintName: fk_gradesheet_block_gradesheet
            referencedTableName: gradesheet_gradesheet
            referencedColumnNames: id
            onDelete: CASCADE
