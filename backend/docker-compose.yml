services:
  postgres:
    image: postgres:17-alpine
    container_name: uits_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uits_db}
      POSTGRES_USER: ${POSTGRES_USER:-uits_stankin_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан POSTGRES_PASSWORD в backend/.env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  schedule-service:
    build: ../schedule-service
    container_name: uits_schedule_service
    ports:
      - "${SCHEDULE_SERVICE_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: uits_postgres_data