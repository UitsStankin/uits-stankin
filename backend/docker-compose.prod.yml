version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: uits_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uits_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт наружу НЕ пробрасываем — доступ только изнутри Docker-сети
    networks:
      - uits_network

  backend:
    image: uits-backend:latest
    container_name: uits_backend
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      # Обязательно: без прод-профиля сработает профиль по умолчанию dev,
      # и DevDataSeeder зальёт тестовые учётки в боевую базу
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-uits_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    networks:
      - uits_network

volumes:
  postgres_data:
    name: uits_postgres_data

networks:
  uits_network:
    name: uits_network