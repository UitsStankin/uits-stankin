services:
  postgres:
    image: postgres:17-alpine
    container_name: uits_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uits_db}
      # Без дефолта: значение по умолчанию postgres — суперпользователь кластера,
      # приложение обязано ходить в базу под своей учёткой
      POSTGRES_USER: ${POSTGRES_USER:?не задан POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # -h 127.0.0.1 обязателен: по unix-сокету pg_isready отвечает OK уже во время
    # инициализации кластера, когда снаружи база ещё не принимает подключения
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    # Порт наружу НЕ пробрасываем — доступ только изнутри Docker-сети
    networks:
      - uits_network

  backend:
    # Образ собирается в CI и публикуется в GHCR; тег — sha коммита,
    # чтобы версия на стенде однозначно сходилась с историей git
    image: ghcr.io/uitsstankin/uits-backend:${IMAGE_TAG:?не задан IMAGE_TAG}
    container_name: uits_backend
    restart: unless-stopped
    # Ждём не запуска контейнера базы, а её готовности принимать подключения:
    # иначе Liquibase стартует раньше и приложение падает на миграциях
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Обязательно: без прод-профиля сработает профиль по умолчанию dev,
      # и DevDataSeeder зальёт тестовые учётки в боевую базу
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-uits_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?не задан POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?не задан POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?не задан JWT_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION:-1209600000}
      REFRESH_GRACE_PERIOD: ${REFRESH_GRACE_PERIOD:-60000}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_PERIOD: ${LOGIN_RATE_LIMIT_PERIOD:-60000}
      # Без этой переменной прод-фронт упрётся в дефолт http://localhost:5173
      # и получит отказ на каждом запросе
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?не задан CORS_ALLOWED_ORIGINS}
      STORAGE_ROOT: /app/media
      ORPHAN_CLEANUP_MIN_AGE: ${ORPHAN_CLEANUP_MIN_AGE:-86400000}
      ORPHAN_CLEANUP_CATEGORIES: ${ORPHAN_CLEANUP_CATEGORIES:-news,avatars,achievements}
    volumes:
      - media_data:/app/media
    networks:
      - uits_network

volumes:
  postgres_data:
    name: uits_postgres_data
  media_data:
    name: uits_media_data

networks:
  uits_network:
    name: uits_network
