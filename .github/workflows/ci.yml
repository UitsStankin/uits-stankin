name: CI

# Сборка и тесты бэкенда. Запускается:
#  - на каждый pull request;
#  - на push в dev (защита интеграционной ветки);
#  - по вызову из другого workflow (deploy.yml переиспользует этот job,
#    чтобы деплой шёл только после зелёных тестов и логика сборки не дублировалась).
#
# Фильтр по изменённым файлам живёт внутри job'а, а не в `on: pull_request`.
# Обязательный статус-чек ждёт результата на каждом PR: если workflow вовсе
# не стартует, результата нет и PR остаётся в «Waiting for status» навсегда.
# Возвращать paths в `on: pull_request` нельзя, пока чек обязателен.
#
# Markdown внутри backend/ из фильтра исключён: правка README поднимала
# Testcontainers и гоняла весь набор тестов ради текста.
on:
  pull_request:
  push:
    branches: [ dev ]
    paths:
      - "backend/**"
      - "!backend/**.md"
      - ".github/workflows/**"
  workflow_call:

# Новый push в PR отменяет ещё бегущий прогон по той же ветке: на публичном
# репозитории минуты Actions бесплатны, экономится время ожидания и очередь
# раннеров. Прогоны на dev не отменяются.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Прогон укладывается в две минуты. Без явного лимита дефолт GitHub — 6 часов:
    # зависший runner молча съедает минуты Actions и держит жёлтый статус
    timeout-minutes: 15

    steps:
      - name: Checkout кода
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0
        with:
          fetch-depth: 0

      - name: Изменения в backend
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          # every: файл обязан совпасть со всеми паттернами фильтра. В режиме
          # по умолчанию хватает одного, а '!backend/**.md' означает «что угодно,
          # кроме .md внутри backend» — под него подходит и docs/, и frontend/,
          # и фильтр срабатывает на правке документации.
          # Пути workflow вынесены во второй фильтр: при every все паттерны
          # одного фильтра обязаны совпасть, а файл не лежит в двух каталогах
          predicate-quantifier: every
          filters: |
            backend:
              - 'backend/**'
              - '!backend/**.md'
            workflows:
              - '.github/workflows/**'

      - name: Нужна ли сборка
        id: gate
        run: echo "build=${{ github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true' || steps.changes.outputs.workflows == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Установка JDK 21
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Встроенное кэширование Gradle: заменяет ручной actions/cache
          cache: gradle

      - name: Права на gradlew
        if: steps.gate.outputs.build == 'true'
        run: chmod +x ./gradlew
        working-directory: backend

      - name: Сборка и тесты
        if: steps.gate.outputs.build == 'true'
        # --no-daemon: в CI сборка одна, переиспользовать демон некому,
        # а лишний живущий JVM-процесс мешает шагу завершиться
        run: ./gradlew build --no-daemon
        working-directory: backend
        # Тесты с Testcontainers работают в GitHub Actions из коробки:
        # Docker уже установлен на ubuntu-latest runners

      - name: Анализ SonarQube
        if: steps.gate.outputs.build == 'true'
        run: ./gradlew sonar --no-daemon
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Отчёт о покрытии
        if: always() && steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/
          retention-days: 7

      # При падении сборки HTML-отчёт и XML-результаты тестов сохраняются
      # артефактом — иначе причину падения видно только в сыром логе Gradle
      - name: Отчёты тестов при падении
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  # Образ собирается здесь, а не на VPS: сборка на боевой машине ест её ресурсы,
  # а результат нигде не хранится (ARCHITECTURE §8).
  publish-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    # На pull request образ не публикуется — публикуется то, что уже влито.
    # Условие покрывает и push в dev, и вызов из deploy.yml на push в main.
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    permissions:
      contents: read
      # GITHUB_TOKEN по умолчанию не умеет публиковать пакеты — без этой строки push в GHCR даёт 403
      packages: write

    steps:
      - name: Checkout кода
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0

      # Нужен для кэша сборки type=gha: он работает только на драйвере docker-container
      - name: Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Логин в GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация образа
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: backend
          push: true
          # Имя образа только строчными буквами: GHCR не принимает UitsStankin.
          # Тег по sha, не latest: версия на проде однозначно сходится с коммитом,
          # а docker pull не может отдать закэшированный старый образ под тем же именем
          tags: ghcr.io/uitsstankin/uits-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
