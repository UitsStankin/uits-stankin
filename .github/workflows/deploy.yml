name: Deploy

# Деплой на VPS. Запускается только на push в main (то есть после merge PR)
# и только после зелёной сборки с тестами из ci.yml.
on:
  push:
    branches: [ main ]

jobs:
  # Переиспользование workflow ci.yml: та же сборка и тесты, что на PR.
  # Логика живёт в одном месте — правки CI автоматически касаются и деплоя.
  build-and-test:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test  # запускается только если тесты прошли

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Копируем файлы на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/"
          target: "/opt/uits/"

      - name: Билд и запуск на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/uits/backend

            # Собираем Docker-образ прямо на сервере
            docker build -t uits-backend:latest .

            # Останавливаем старые контейнеры и запускаем новые
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            # Чистим старые образы, чтобы не забивать диск
            docker image prune -f

            echo "=== Деплой завершён ==="
