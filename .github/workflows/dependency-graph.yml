name: Dependency graph

# Отправка дерева зависимостей Gradle в граф зависимостей GitHub.
#
# Без этого шага Java-части проекта в графе нет: `build.gradle.kts` GitHub
# самостоятельно не резолвит, и security-алерты по бэкенду не приходят вовсе —
# ни по объявленным библиотекам, ни по транзитивным версиям из BOM Spring Boot.
# Проверено в T-54f: в графе были только npm, pip и github-actions, а найденные
# вручную уязвимости — включая критические в tomcat-embed-core — не показывал
# никто.
#
# Запуск только с главной ветки: алерты Dependabot считаются по ней, а сабмишен
# из веток PR-ов наполнял бы граф состоянием, которого в проекте ещё нет.
on:
  push:
    branches: [ main ]
    paths:
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/gradle/**"
      - ".github/workflows/dependency-graph.yml"
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Запись графа зависимостей идёт под этим правом, отдельного токена не нужно
      contents: write

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Права на gradlew
        run: chmod +x ./gradlew
        working-directory: backend

      # Экшен сам резолвит конфигурации и отправляет результат: в граф попадают
      # и объявленные зависимости, и транзитивные с фактическими версиями
      - name: Сабмишен дерева зависимостей
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: backend
